name: K60 source integrity and small Lean encoding check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Complete source controls and five-module encoding build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out sources without native evidence archives
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Check all selected sources and audit tests
        run: |
          set -euo pipefail
          mkdir verification-artifacts
          git rev-parse HEAD > verification-artifacts/commit.txt
          python3 -B scripts/check_lean_sources.py --report verification-artifacts/source-audit.json
          make test-ci
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [Path('formal') / p['path'] for p in json.loads(Path('formal/SOURCE_MANIFEST.json').read_text())['files']]
          files += [Path(p) for p in ('formal/SOURCE_MANIFEST.json',
                    'publication/checks/ACCEPTED_MATH_MANIFEST.sha256',
                    'publication/checks/PUBLIC_SOURCE_PROVENANCE.json',
                    'scripts/lean_ci.py', 'scripts/check_lean_sources.py',
                    'scripts/test_lean_audits.py', 'Makefile', '.github/workflows/verify.yml')]
          rows = [{'path': str(p), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          Path('verification-artifacts/control-hashes.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY
      - name: Install pinned Lean and retrieve Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: formal
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false
          leanchecker: false
          nanoda: false
      - name: Compile five encoding modules and audit two theorem assumptions
        run: |
          set -euo pipefail
          make lean-ci 2>&1 | tee verification-artifacts/small-lean-driver.log
      - name: Retain source controls and small-build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k60-source-integrity-and-small-lean-check
          path: verification-artifacts/
          if-no-files-found: warn
      - name: State the verification boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          All 1,390 selected mathematical modules and 110 embedded data files passed
          source/hash/import/census controls. The five-module UniformK60.CoreCounts
          target compiled and its two theorem axiom reports passed.
          This job did not rebuild the complete reduction, replay classification
          certificates, check exact native input bindings, or run a SAT solver.
          TEXT
