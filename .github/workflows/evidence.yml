name: Passive K60 evidence verification

# This workflow requires an externally pinned release-candidate index.
# This job executes neither Lean nor a SAT solver.
on:
  workflow_dispatch:
    inputs:
      release_index_sha256:
        description: Independently obtained SHA256 of publication/checks/K60_RELEASE.json
        required: true
        type: string
      require_cadical:
        description: Require the completed second-solver evidence before publication
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  evidence:
    name: Authenticate and passively verify both evidence capsules
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      K60_RELEASE_INDEX_SHA256: ${{ inputs.release_index_sha256 }}
      K60_REQUIRE_CADICAL: ${{ inputs.require_cadical }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the selected revision without large archives
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Authenticate the release index and public verification tools
        run: |
          set -euo pipefail
          mkdir verification-artifacts
          git rev-parse HEAD > verification-artifacts/commit.txt
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          expected = os.environ['K60_RELEASE_INDEX_SHA256']
          if not re.fullmatch('[0-9a-f]{64}', expected):
              raise ValueError('An external release-index SHA256 is required')
          path = Path('publication/checks/K60_RELEASE.json')
          raw = path.read_bytes()
          if path.is_symlink() or hashlib.sha256(raw).hexdigest() != expected:
              raise ValueError('Release index hash mismatch')
          index = json.loads(raw)
          if set(index.get('capsules', {})) != {'formal', 'native'}:
              raise ValueError('Exactly the formal and native capsules are required')
          checker = Path('scripts/check_publication.py')
          data = checker.read_bytes()
          if checker.is_symlink() or index['files'][checker.as_posix()] != {
                  'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}:
              raise ValueError('Changed package checker')
          for label, capsule in index['capsules'].items():
              archive = 'archives/k60-' + label + '-evidence.tar.gz'
              if capsule['archive'] != archive:
                  raise ValueError('Inconsistent archive identity')
              if not re.fullmatch('[0-9a-f]{64}', capsule['manifest_sha256']):
                  raise ValueError('Invalid capsule manifest pin')
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('K60_' + label.upper() + '_MANIFEST_SHA256=' + capsule['manifest_sha256'] + '\n')
          shutil.copyfile(path, 'verification-artifacts/K60_RELEASE.json')
          Path('verification-artifacts/release-index.sha256').write_text(expected + '\n')
          PY
          args=()
          if [[ "$K60_REQUIRE_CADICAL" == true ]]; then args+=(--require-cadical); fi
          python3 -B scripts/check_publication.py --skip-archives \
            --release-index-sha256 "$K60_RELEASE_INDEX_SHA256" "${args[@]}" \
            --report verification-artifacts/index-verification.json

      - name: Download only the K60 archive and split native parts
        run: |
          set -euo pipefail
          git lfs pull --include="archives/k60-*.tar.gz*" --exclude=""

      - name: Check archive hashes and safely extract fresh capsule roots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, sys, tarfile
          from pathlib import Path
          if sys.version_info < (3, 12):
              raise RuntimeError('This CI extraction step requires Python 3.12 or newer')
          raw = Path('publication/checks/K60_RELEASE.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ['K60_RELEASE_INDEX_SHA256']:
              raise ValueError('Release index changed')
          index = json.loads(raw)

          class PartStream(io.RawIOBase):
              """Read ordered files as one stream without storing a second large archive."""
              def __init__(self, paths):
                  super().__init__()
                  self.paths = iter(paths)
                  self.current = None
              def readable(self):
                  return True
              def readinto(self, buffer):
                  while True:
                      if self.current is None:
                          path = next(self.paths, None)
                          if path is None:
                              return 0
                          self.current = path.open('rb')
                      count = self.current.readinto(buffer)
                      if count:
                          return count
                      self.current.close()
                      self.current = None
              def close(self):
                  if self.current is not None:
                      self.current.close()
                      self.current = None
                  super().close()

          for label in ('formal', 'native'):
              capsule = index['capsules'][label]
              expected = capsule['archive_pin']
              parts = capsule.get('parts', [{'path': capsule['archive'], **expected}])
              digest = hashlib.sha256()
              size = 0
              paths = []
              for part in parts:
                  path = Path(part['path'])
                  if path.is_symlink() or not path.is_file():
                      raise ValueError('Invalid archive part: ' + str(path))
                  part_digest = hashlib.sha256()
                  part_size = 0
                  with path.open('rb') as stream:
                      for block in iter(lambda: stream.read(1 << 20), b''):
                          part_digest.update(block)
                          digest.update(block)
                          part_size += len(block)
                          size += len(block)
                  if part_size != part['bytes'] or part_digest.hexdigest() != part['sha256']:
                      raise ValueError('Archive part hash or size mismatch: ' + str(path))
                  paths.append(path)
              if size != expected['bytes'] or digest.hexdigest() != expected['sha256']:
                  raise ValueError('Concatenated archive hash or size mismatch: ' + label)
              destination = Path('k60-' + label + '-capsule')
              destination.mkdir()
              seen = set()
              with PartStream(paths) as source, io.BufferedReader(source) as stream:
                  with tarfile.open(fileobj=stream, mode='r|gz') as archive:
                      for item in archive:
                          if not item.isfile() or item.name in seen:
                              raise ValueError('Archive contains nonregular or duplicate members')
                          seen.add(item.name)
                          archive.extract(item, destination, filter='data')
          PY

      - name: Verify both capsules and their common selected formula boundary
        run: |
          set -euo pipefail
          args=()
          if [[ "$K60_REQUIRE_CADICAL" == true ]]; then args+=(--require-cadical); fi
          python3 -B scripts/check_publication.py \
            --release-index-sha256 "$K60_RELEASE_INDEX_SHA256" "${args[@]}" \
            --formal-capsule "$PWD/k60-formal-capsule" --native-capsule "$PWD/k60-native-capsule" \
            --report verification-artifacts/package-verification.json \
            2>&1 | tee verification-artifacts/package-verification.log

      - name: Retain index, revision and passive verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-k60-evidence-check
          path: verification-artifacts/
          if-no-files-found: warn

      - name: State the checked boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          The externally pinned release index, public verifier bytes, archive hashes,
          and both complete capsule evidence checks passed for the recorded revision.
          This job inspected retained sources, formulas, build/binding receipts and
          native logs. It did not rerun Lean's kernel, classification certificates,
          or native solvers, and it did not check complete K60 UNSAT refutations.
          Native UNSAT remains external computational evidence for the formal reduction.
          The retained package report states whether the complete CaDiCaL evidence
          was present; a preparation check with require_cadical=false is not a
          claim that the second-solver campaign has completed.
          TEXT
